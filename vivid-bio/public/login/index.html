<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logowanie</title>

<link rel="stylesheet" href="/login/auth.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="/login/auth.js"></script>
</head>
<body>

<div class="auth">
  <div class="box">

    <h2 id="title">Logowanie</h2>

    <div id="msg" class="msg"></div>

    <input id="email" type="email" placeholder="Email">

    <input id="password" type="password" placeholder="Hasło">

    <input id="password2" type="password" placeholder="Powtórz hasło" class="hidden">

    <button id="loginBtn">Zaloguj</button>
    <button id="registerBtn" class="hidden">Utwórz konto</button>

    <button id="toggle" class="ghost">
      Nie masz konta? Zarejestruj się
    </button>

    <button id="reset" class="ghost">
      Zresetuj hasło
    </button>

    <div class="divider">lub</div>

    <button id="google" class="oauth google">Zaloguj przez Google</button>
    <button id="github" class="oauth github">Zaloguj przez GitHub</button>

  </div>
</div>

</body>
</html>
