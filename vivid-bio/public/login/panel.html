<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel bio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="panel.js"></script>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<div class="panel">
  <h2>Edytuj bio</h2>

  <input id="username" placeholder="Username">
  <input id="display" placeholder="Nick">
  <textarea id="bio" placeholder="Opis"></textarea>

  <button id="save">Zapisz</button>

  <h3>Podgląd</h3>
  <iframe id="preview"></iframe>
</div>

</body>
</html>
