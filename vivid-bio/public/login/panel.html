<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel bio</title>

<link rel="stylesheet" href="panel.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="panel.js"></script>
</head>
<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>Panel</h2>

    <div class="nav">
      <button class="tab active" data-tab="profile">Profil</button>
      <button class="tab" data-tab="links">Linki</button>
      <button class="tab" data-tab="appearance">Wygląd</button>
    </div>

    <button id="logout" class="logout">Wyloguj</button>
  </aside>

  <!-- EDITOR -->
  <main class="editor">

    <!-- PROFILE -->
    <section class="section active" id="profile">
      <div class="card">
        <h3>Profil</h3>

        <input id="username" placeholder="username">
        <input id="display_name" placeholder="nazwa wyświetlana">
        <textarea id="bio" placeholder="opis"></textarea>

        <label class="check">
          <input type="checkbox" id="private">
          Profil prywatny
        </label>
      </div>
    </section>

    <!-- LINKS -->
    <section class="section" id="links">
      <div class="card">
        <h3>Linki</h3>

        <div id="linksContainer"></div>

        <button id="addLink" class="ghost">+ Dodaj link</button>
      </div>
    </section>

    <!-- APPEARANCE -->
    <section class="section" id="appearance">
      <div class="card">
        <h3>Wygląd</h3>

        <label>Avatar</label>
        <input type="file" id="avatar">

        <label>Tło</label>
        <input type="file" id="background">
      </div>
    </section>

    <button id="save" class="save">Zapisz zmiany</button>

  </main>

  <!-- PREVIEW -->
  <div class="preview">
    <iframe id="previewFrame"></iframe>
  </div>

</div>

</body>
</html>
