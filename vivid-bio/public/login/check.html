<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprawdź skrzynkę</title>

<link rel="stylesheet" href="/login/auth.css">
</head>
<body>

<div class="auth">
  <div class="box check">

    <div class="icon">📩</div>

    <h2>Sprawdź skrzynkę</h2>

    <p class="info">
      Wysłaliśmy link aktywacyjny na Twój e-mail.<br>
      Kliknij w wiadomości, aby aktywować konto.
    </p>

    <button onclick="location.href='/login'">
      Wróć do logowania
    </button>

    <button class="ghost" onclick="location.reload()">
      Wyślij ponownie
    </button>

  </div>
</div>

</body>
</html>
