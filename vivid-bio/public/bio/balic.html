<!doctype html>
<html lang="pl">
<head>

<body>

<div class="rpc">
  <img id="rpcAvatar" class="rpc-avatar" src="">
  <div class="rpc-info">
    <div id="rpcName">Loading…</div>
    <div class="rpc-status">
      <span id="rpcDot" class="rpc-dot"></span>
      <span id="rpcText">Connecting</span>
    </div>
  </div>
</div>

<div id="audioGate">
  <span>TAP TO ENTER</span>
</div>

<video
  id="audio"
  class="bg-video"
  autoplay
  muted
  loop
  playsinline
  preload="metadata"
  poster="poster.jpg">
  <source src="/bio/bg.mp4" type="video/mp4">
</video>

<canvas id="embers"></canvas>
<div class="vignette"></div>
<div class="grain"></div>

<main class="hud">

  <img class="pfp" src="https://cdn.discordapp.com/avatars/738344155108999238/eb12d1c7f984f4512ee9016911ce96dd.webp">
  <h1>Balic</h1>
  <p>streamer · gambler · private</p>

  <div class="icons">
    <a href="https://www.instagram.com/jakub.balic/"><i class="fa-brands fa-instagram"></i></a>
    <a href="https://www.twitch.tv/gamebalic"><i class="fa-brands fa-twitch"></i></a>
    <a href="https://www.tiktok.com/@.balic"><i class="fa-brands fa-tiktok"></i></a>
    <a href="https://discord.gg/7r77QNDg9j"><i class="fa-brands fa-discord"></i></a>
  </div>
</main>

<div class="audio-hud">
  <i class="fa-solid fa-volume-high"></i>
  <input type="range" min="0" max="100" value="100" id="volume">
</div>

<script src="/bio/app.js"></script>
<script src="/bio/embers.js"></script>
<script src="/bio/fingerprint.js"></script>
<script src="/rpc-client/rpc.js"></script>
</body>
</html>
